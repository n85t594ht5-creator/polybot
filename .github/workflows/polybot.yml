name: PolyBot paper test

on:
  workflow_dispatch:
  schedule:
    - cron: "5 */6 * * *"

concurrency:
  group: polybot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests python-dotenv

      - name: Publish live dashboard page
        env:
          GIST_RAW_URL: ${{ vars.GIST_RAW_URL }}
        run: |
          python report.py
          git config user.name "polybot"
          git config user.email "polybot@users.noreply.github.com"
          git add docs/index.html && (git commit -m "dashboard page" && git push) || true

      - name: Run bot (5h40m) + gist sync
        env:
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          MODE: paper
          ASSETS: ${{ vars.ASSETS || 'BTC,ETH,SOL' }}
          BANKROLL: ${{ vars.BANKROLL || '500' }}
          MAX_ENTRY: ${{ vars.MAX_ENTRY || '0.15' }}
          MIN_ELAPSED: ${{ vars.MIN_ELAPSED || '0.50' }}
          MIN_MOVE: ${{ vars.MIN_MOVE || '0.0008' }}
          MIN_CONF: ${{ vars.MIN_CONF || '0.60' }}
          KELLY_FRAC: ${{ vars.KELLY_FRAC || '0.25' }}
          MAX_POSITIONS: ${{ vars.MAX_POSITIONS || '10' }}
          MAX_EXPOSURE: ${{ vars.MAX_EXPOSURE || '0.40' }}
          WINDOWS: ${{ vars.WINDOWS || '15,60' }}
          PRICE_SOURCE: coinbase
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python gist_sync.py &
          timeout -s INT 340m python bot.py || true
          kill %1 2>/dev/null || true

      - name: Save state back to repo
        env:
          GIST_RAW_URL: ${{ vars.GIST_RAW_URL }}
        run: |
          tail -n 2000 bot.log > bot.tmp && mv bot.tmp bot.log
          python report.py

          git add state.json trades.csv bot.log docs/index.html
          git commit -m "paper run $(date -u +'%Y-%m-%d %H:%M')" || echo "nothing to commit"
          git pull --rebase
          git push
