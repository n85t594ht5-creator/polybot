name: PolyBot backtest

on:
  workflow_dispatch:
    inputs:
      days_15m:
        description: "Дней истории для 15m и 1h"
        default: "14"
      days_5m:
        description: "Дней истории для 5m"
        default: "3"

concurrency:
  group: backtest
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Collect history
        working-directory: backtest
        env:
          DAYS_15M: ${{ github.event.inputs.days_15m || '14' }}
          DAYS_1H: ${{ github.event.inputs.days_15m || '14' }}
          DAYS_5M: ${{ github.event.inputs.days_5m || '3' }}
        run: python collect.py
      - name: Simulate + grid search
        working-directory: backtest
        run: python simulate.py
      - name: Publish
        run: |
          cp backtest/docs/backtest.html docs/backtest.html
          git config user.name "polybot"
          git config user.email "polybot@users.noreply.github.com"
          git add backtest/results docs/backtest.html
          git commit -m "backtest $(date -u +'%Y-%m-%d %H:%M')" || true
          git pull --rebase
          git push
